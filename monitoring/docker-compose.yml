name: monitoring
services:
  grafana:
    # image: grafana/grafana:12.3.4
    image: grafana/grafana:13.1.0-25644485979-ubuntu
    container_name: grafana
    volumes:
      - ./storage/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/ldap.toml:/etc/grafana/ldap.toml:ro
    environment:
      - GF_RENDERING_SERVER_URL=http://grafana-image-renderer:8081/render
      - GF_RENDERING_RENDERER_TOKEN=${GF_RENDERING_RENDERER_TOKEN:?}
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_AUTH_LDAP_ENABLED=true
      - GF_AUTH_LDAP_CONFIG_FILE=/etc/grafana/ldap.toml
      - GF_AUTH_LDAP_ALLOW_SIGN_UP=true
      - GF_LOG_FILTERS=ldap:debug
      - GF_LDAP_HOST=${GF_LDAP_HOST:?}
      - GF_LDAP_PORT=${GF_LDAP_PORT:?}
      - GF_LDAP_USER=${GF_LDAP_USER:?}
      - GF_LDAP_PASS=${GF_LDAP_PASS:?}
      - GF_INSTALL_PLUGINS=https://github.com/VictoriaMetrics/victoriametrics-datasource/releases/download/v0.10.3/victoriametrics-datasource-v0.10.3.zip;victoriametrics-datasource,yesoreyeram-infinity-datasource
        #,https://github.com/jdbranham/grafana-diagram/releases/download/v1.10.4/jdbranham-diagram-panel-1.10.4.zip;diagram-panel
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=victoriametrics-datasource
    restart: unless-stopped
    cpus: 1
    mem_limit: 1G
    networks:
      - default
      - reverse-proxy
      - lldap
    labels:
      - "traefik.docker.network=reverse-proxy"
      - "traefik.http.routers.grafana.rule=Host(`grafana.home.ohmymndy.com`)"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.enable=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 2s
      retries: 3
      start_period: 40s
      start_interval: 5s

  grafana-image-renderer:
    #image: grafana/grafana-image-renderer:3.11.6
    image: grafana/grafana-image-renderer:v5.8.3
    container_name: grafana-image-renderer
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m
    environment:
      ENABLE_METRICS: "true"
      AUTH_TOKEN: "${GF_RENDERING_RENDERER_TOKEN:?}"

  # loki:
  #   image: grafana/loki:3.3.2
  #   restart: unless-stopped
  #
