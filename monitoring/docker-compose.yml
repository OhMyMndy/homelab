  #     - host.docker.internal:host-gateway

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.136.0
    container_name: victoriametrics
    restart: unless-stopped
    volumes:
      - ./storage/victoriametrics:/storage
    command:
      - "--storageDataPath=/storage"
    # ports:
    # - 8428:8428
    # depends_on:
    #   - cadvisor
    networks:
      - default
      - reverse-proxy
    cpus: 1
    mem_limit: 2048m
    labels:
      - "traefik.docker.network=reverse-proxy"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.home.ohmymndy.com`)"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.middlewares=prometheus-auth"
      - "traefik.http.middlewares.prometheus-auth.basicauth.users=${PROMETHEUS_AUTH:?}"
