  ## Logs
  #
  loki:
    image: grafana/loki:3.7
    container_name: loki
    restart: unless-stopped
    cpus: 1
    mem_limit: 1024m
    command:
      - -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml
      - ./storage/loki:/loki
    user: ${PUID:?}:${PGID:?}
    networks:
      - default
      - reverse-proxy
    labels:
      - "traefik.docker.network=reverse-proxy"
      - "traefik.http.routers.loki.rule=Host(`loki.home.ohmymndy.com`)"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"
      - "traefik.http.routers.loki.tls=true"
      - "traefik.enable=true"
      - "traefik.http.routers.loki.middlewares=loki-auth"
      - "traefik.http.middlewares.loki-auth.basicauth.users=${LOKI_AUTH:?}"
    # healthcheck:
    #   test: wget --quiet --tries=1 --output-document=- http://localhost:3100/ready || exit 1
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 60s
    #   start_interval: 5s

  alloy:
    image: grafana/alloy:v1.16.1
    container_name: alloy
    restart: unless-stopped
    cpus: 0.4
    mem_limit: 1024m
    networks:
      - default
      - omada_exporter
    command:
      [
        "run",
        "--server.http.listen-addr=0.0.0.0:12345",
        "--storage.path=/var/lib/alloy/data",
        "/etc/alloy/config.alloy",
      ]
    env_file:
      - .env
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - ./storage/alloy:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
networks:
  default:
  reverse-proxy:
    external: true
    name: reverse-proxy
  lldap:
    name: lldap_default
    external: true
  omada_exporter:
    external: true
    name: omada_exporter_default
