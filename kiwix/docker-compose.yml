name: kiwix
services:
  downloader:
    image: downloader:0.1
    container_name: kiwix-downloader
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 1024M
    build:
      dockerfile: ./aria2/Dockerfile
    volumes:
      - /mnt/media/kiwix:/library
      - ./aria2/run.sh:/run.sh:ro
      - ./aria2/complete.sh:/complete.sh:ro
      - ./zim-list.txt:/zim-list.txt:ro
    entrypoint: /run.sh
    user: "${PUID:?}:${PGID:?}"
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.8.1
    container_name: kiwix
    cpus: 0.25
    mem_limit: 512M
    volumes:
      - /mnt/media/kiwix:/library
      - ./kiwix-entrypoint.sh:/entrypoint.sh
    networks:
      - default
      - reverse-proxy
    # command: "/library/*.zim" # --address 0.0.0.0"
    entrypoint: /entrypoint.sh
    restart: unless-stopped
    labels:
      - "traefik.docker.network=reverse-proxy"
      - "traefik.http.routers.kiwix.rule=Host(`kiwix.home.ohmymndy.com`)"
      - "traefik.http.services.kiwix.loadbalancer.server.port=8080"
      - "traefik.http.routers.kiwix.tls=true"

      - "traefik.enable=true"
networks:
  default:
  reverse-proxy:
    external: true
    name: reverse-proxy
